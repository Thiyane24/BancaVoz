databases:
  - name: bancavoz-db
    plan: free
    databaseName: bancavoz
    user: bancavoz

services:
  - type: web
    name: bancavoz
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BANCAVOZ_ENV
        value: production
      - key: BANCAVOZ_DATABASE_URL
        fromDatabase:
          name: bancavoz-db
          property: connectionString
      - key: BANCAVOZ_BEARER_TOKEN
        sync: false
      - key: BANCAVOZ_MERCHANT_ID
        value: demo-merchant
      - key: BANCAVOZ_RATE_LIMIT
        value: "120"
