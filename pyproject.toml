[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bancavoz"
version = "0.1.0"
description = "Voice-first merchant ledger MVP"
requires-python = ">=3.12,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "fastapi==0.150.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "mcp==1.30.0",
  "tzdata==2026.5",
  "psycopg[binary]==3.3.6",
  "boto3==1.42.63",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "pytest-cov==7.1.0",
  "mypy==2.4.0",
  "bandit==1.9.3",
  "pip-audit==2.10.0",
]

[project.scripts]
bancavoz-seed = "bancavoz.seed:main"
bancavoz-migrate = "bancavoz.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["bancavoz*"]

[tool.setuptools.package-data]
bancavoz = ["web/*.html", "web/static/*"]
