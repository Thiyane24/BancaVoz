[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bancavoz"
version = "0.1.0"
description = "Voice-first merchant ledger MVP"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mcp = ["mcp==1.2.0"]
bedrock = ["boto3>=1.35"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
bancavoz-seed = "bancavoz.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["bancavoz*"]
