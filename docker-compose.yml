services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bancavoz
      POSTGRES_USER: bancavoz
      POSTGRES_PASSWORD: bancavoz-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancavoz -d bancavoz"]
      interval: 5s
      timeout: 5s
      retries: 10
  bancavoz:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BANCAVOZ_ENV: ${BANCAVOZ_ENV:-development}
      BANCAVOZ_DATABASE_URL: postgresql://bancavoz:bancavoz-local-only@postgres:5432/bancavoz
      BANCAVOZ_BEARER_TOKEN: ${BANCAVOZ_BEARER_TOKEN:-dev-token}
      BANCAVOZ_MERCHANT_ID: ${BANCAVOZ_MERCHANT_ID:-demo-merchant}
      BANCAVOZ_RATE_LIMIT: ${BANCAVOZ_RATE_LIMIT:-120}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - bancavoz-data:/app/data

volumes:
  bancavoz-data:
